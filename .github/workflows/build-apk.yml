name: Build & Sign APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install dependencies
        working-directory: apps/user-web-app
        run: npm install

      - name: Sync Capacitor
        working-directory: apps/user-web-app
        run: npx cap sync

      - name: Decode Keystore
        run: |
          mkdir -p apps/user-web-app/android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > apps/user-web-app/android/app/keystore/payparq-release.jks

      - name: Build & Sign APK
        working-directory: apps/user-web-app/android
        env:
          KEYSTORE_PATH: app/keystore/payparq-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv apps/user-web-app/android/app/build/outputs/apk/release/app-release.apk \
             apps/user-web-app/android/app/build/outputs/apk/release/payparq-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayParq-APK
          path: apps/user-web-app/android/app/build/outputs/apk/release/payparq-app.apk
          retention-days: 30
