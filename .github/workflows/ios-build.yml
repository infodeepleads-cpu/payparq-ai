name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: apps/user-web-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Decode signing certificate
        run: |
          echo "${{ secrets.IOS_DISTRIBUTION_CERT_B64 }}" | base64 --decode > /tmp/original.p12
          OPENSSL=$(brew --prefix openssl@3)/bin/openssl
          echo "OpenSSL version: $($OPENSSL version)"
          $OPENSSL pkcs12 -in /tmp/original.p12 -out /tmp/cert.pem -passin pass: -nodes || \
          $OPENSSL pkcs12 -legacy -in /tmp/original.p12 -out /tmp/cert.pem -passin pass: -nodes
          $OPENSSL pkcs12 -export -legacy -in /tmp/cert.pem -out /tmp/payparq_distribution.p12 -passout pass:buildci

      - name: Decode provisioning profile
        run: |
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}" | base64 --decode > /tmp/payparq.mobileprovision

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/payparq.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Import signing certificate into Keychain
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/payparq_distribution.p12 -k build.keychain -P "buildci" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Build IPA
        run: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath ./build/App.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="payparq-provisioning-profile" \
            DEVELOPMENT_TEAM="T254J772YJ"

      - name: Export IPA
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath ./build/App.xcarchive \
            -exportOptionsPlist ./ExportOptions.plist \
            -exportPath ./build

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayParq-IPA
          path: apps/user-web-app/ios/App/build/*.ipa

      - name: Upload to TestFlight
        if: success()
        run: |
          xcrun altool --upload-app \
            -f ios/App/build/*.ipa \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_PASSWORD }}" \
            -t ios
