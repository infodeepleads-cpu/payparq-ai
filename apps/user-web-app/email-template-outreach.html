<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payparq - More than parking</title>
<style>
body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
table { width: 100%; border-collapse: collapse; }
td { padding: 0; }
img { max-width: 100%; height: auto; display: block; }
a { text-decoration: none; color: #000; }
.container { max-width: 600px; margin: 0 auto; background: #fff; }
.design-wrapper { width: 100%; }
.design-wrapper img { width: 100%; height: auto; }
.price-banner { padding: 30px 20px; text-align: center; background: #fff; border-top: 2px solid #000; border-bottom: 2px solid #000; }
.price-text { font-size: 48px; font-weight: bold; color: #000; margin: 0; }
.price-label { font-size: 13px; color: #000; margin: 10px 0 0 0; text-transform: uppercase; letter-spacing: 1px; }
.links-section { padding: 30px 20px; text-align: center; background: #fff; }
.link-button { display: inline-block; margin: 10px 5px; padding: 12px 28px; background: #000; color: #fff; text-decoration: none; border-radius: 4px; font-weight: 600; font-size: 14px; }
.link-button:hover { opacity: 0.9; }
.footer { padding: 20px; text-align: center; font-size: 11px; color: #000; border-top: 1px solid #ccc; }
</style>
</head>
<body>
<div class="container">

<!-- DESIGN IMAGE -->
<table>
  <tr>
    <td class="design-wrapper">
      <a href="https://www.payparq.com/get-started" style="display: block;">
        <img src="https://www.payparq.com/ChatGPT%20Image%204.%20svi%202026.%2018_40_16.png" alt="Payparq - More than parking. More possibilities." style="width: 100%; height: auto; display: block;">
      </a>
    </td>
  </tr>
</table>

<!-- PRICE BANNER -->
<table>
  <tr>
    <td class="price-banner">
      <p class="price-text">256€</p>
      <p class="price-label">Average Monthly Earnings</p>
    </td>
  </tr>
</table>

<!-- ACTION LINKS -->
<table>
  <tr>
    <td class="links-section">
      <a href="https://www.payparq.com/get-started" class="link-button">Get started</a>
      <a href="https://www.payparq.com/list-your-space" class="link-button">Start earning</a>
    </td>
  </tr>
</table>

<!-- FOOTER -->
<table>
  <tr>
    <td class="footer">
      <p>Payparq - More than parking. More possibilities.</p>
    </td>
  </tr>
</table>

</div>
</body>
</html>
