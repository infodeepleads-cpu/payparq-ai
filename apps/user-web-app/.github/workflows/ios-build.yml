name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install iOS dependencies
        run: |
          cd ios/App
          pod install --repo-update

      - name: Decode signing certificate
        run: |
          echo "${{ secrets.IOS_DISTRIBUTION_CERT_B64 }}" | base64 -D > /tmp/payparq_distribution.p12

      - name: Decode provisioning profile
        run: |
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}" | base64 -D > /tmp/payparq.mobileprovision

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/payparq.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Import signing certificate into Keychain
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/payparq_distribution.p12 -k build.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool,apple:,codesign -s -k "" build.keychain

      - name: Build IPA
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ./build/App.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="payparq-provisioning-profile" \
            DEVELOPMENT_TEAM="T254J772YJ"

      - name: Export IPA
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath ./build/App.xcarchive \
            -exportOptionsPlist ./ExportOptions.plist \
            -exportPath ./build

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayParq-IPA
          path: ios/App/build/*.ipa

      - name: Upload to TestFlight
        if: success()
        run: |
          xcrun altool --upload-app \
            -f ios/App/build/*.ipa \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_PASSWORD }}" \
            -t ios
