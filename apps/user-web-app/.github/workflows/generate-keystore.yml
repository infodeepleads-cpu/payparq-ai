name: Generate Keystore (Run Once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore payparq-release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias payparq \
            -storepass PayParq2024! \
            -keypass PayParq2024! \
            -dname "CN=PayParq, O=PayParq, L=Zagreb, ST=Zagreb, C=HR"

      - name: Output base64 (copy this to KEYSTORE_BASE64 secret)
        run: |
          echo "====== COPY EVERYTHING BETWEEN THE LINES ======"
          echo "---"
          base64 -w 0 payparq-release.jks
          echo ""
          echo "---"
          echo "====== PASTE AS KEYSTORE_BASE64 IN GITHUB SECRETS ======"
          echo ""
          echo "Other secrets to add:"
          echo "  KEYSTORE_PASSWORD = PayParq2024!"
          echo "  KEY_ALIAS         = payparq"
          echo "  KEY_PASSWORD      = PayParq2024!"
