name: payparq_scanner
description: Tactical Mobile Scanner for PayParq.ai
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  google_mlkit_text_recognition: ^0.15.0
  vibration: ^2.0.1
  supabase_flutter: ^2.5.0
  google_fonts: ^6.2.0
  image_picker: ^1.0.0
  flutter_riverpod: ^2.5.0
  flutter_bloc: ^8.1.0
  equatable: ^2.0.5
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.0
  fl_chart: ^0.66.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  http: ^1.2.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
