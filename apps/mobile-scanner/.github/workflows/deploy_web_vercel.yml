name: Build Flutter Web and Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release
      
      - name: Copy vercel.json into build output
        run: |
          cp vercel.json build/web/vercel.json
      
      - name: Download latest APK from GitHub Releases
        uses: actions/github-script@v7
        id: fetch_apk
        with:
          script: |
            const { owner, repo } = context.repo;
            const rel = await github.rest.repos.getLatestRelease({ owner, repo });
            const asset = rel.data.assets.find(a => a.name === 'app-release.apk');
            if (!asset) {
              core.setFailed('No app-release.apk asset found in latest release.');
            } else {
              core.setOutput('download_url', asset.browser_download_url);
            }
      - name: Save APK into web output
        run: |
          curl -L -o build/web/app-release.apk "${{ steps.fetch_apk.outputs.download_url }}"

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./build/web
          prod: true
