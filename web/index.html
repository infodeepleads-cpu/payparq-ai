<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payparq Scanner</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=pp_v2">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=pp_v2">
  <link rel="manifest" href="manifest.json">
  <style>
    body { background-color: #000; margin: 0; font-family: sans-serif; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #000; z-index: 9999; }
    .loader { color: #fff; font-size: 28px; font-weight: 800; letter-spacing: -0.4px; text-shadow: 0 0 12px rgba(255,255,255,0.24); animation: pulse 1.1s ease-in-out infinite alternate; }
    @keyframes pulse { 0% { opacity: 0.62; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader">payparq.ai</div>
    <div id="boot-status" style="margin-top:14px;color:#9ca3af;font-size:13px;text-align:center;"></div>
  </div>
  <script>
    (function () {
      var statusEl = document.getElementById('boot-status');
      var loadingEl = document.getElementById('loading');
      var didStartFlutter = false;
      var isLoadingHidden = false;
      var surfaceSeenAt = 0;
      var retryStorageKey = 'pp_boot_retry_once';
      var autoRetried = false;
      try {
        autoRetried = window.sessionStorage.getItem(retryStorageKey) === '1';
      } catch (_) {}
      var setStatus = function (text) {
        if (statusEl) statusEl.textContent = text || '';
      };
      var reloadWithCacheBust = function () {
        var url = new URL(window.location.href);
        url.searchParams.set('v', String(Date.now()));
        window.location.replace(url.toString());
      };
      var hideLoading = function () {
        if (isLoadingHidden) return;
        isLoadingHidden = true;
        if (!loadingEl) return;
        loadingEl.style.opacity = '0';
        loadingEl.style.pointerEvents = 'none';
        setTimeout(function () {
          if (loadingEl) loadingEl.style.display = 'none';
        }, 180);
      };
      var markStarted = function () {
        if (didStartFlutter) return;
        didStartFlutter = true;
        clearTimeout(hardTimeoutId);
        clearInterval(flutterUiPoll);
        if (mutationObserver) mutationObserver.disconnect();
        try {
          window.sessionStorage.removeItem(retryStorageKey);
        } catch (_) {}
        hideLoading();
      };
      var showRetry = function (text) {
        setStatus(text);
        if (!loadingEl) return;
        if (document.getElementById('boot-retry')) return;
        var btn = document.createElement('button');
        btn.id = 'boot-retry';
        btn.textContent = 'Reload';
        btn.style.marginTop = '12px';
        btn.style.padding = '10px 14px';
        btn.style.border = '0';
        btn.style.borderRadius = '8px';
        btn.style.fontWeight = '700';
        btn.style.cursor = 'pointer';
        btn.onclick = function () {
          reloadWithCacheBust();
        };
        loadingEl.appendChild(btn);
      };
      setStatus('Starting app...');
      var hardTimeoutId = setTimeout(function () {
        if (!didStartFlutter) {
          if (!autoRetried) {
            try {
              window.sessionStorage.setItem(retryStorageKey, '1');
            } catch (_) {}
            setStatus('Refreshing app...');
            reloadWithCacheBust();
            return;
          }
          showRetry('Startup is taking longer than expected.');
        }
      }, 25000);
      var detectFlutterUi = function () {
        if (didStartFlutter) return;
        var hasFlutterSurface =
          document.querySelector('flt-glass-pane') ||
          document.querySelector('flutter-view') ||
          document.querySelector('flt-scene-host') ||
          document.querySelector('flt-semantics-host') ||
          document.querySelector('canvas');
        if (hasFlutterSurface) {
          if (!surfaceSeenAt) {
            surfaceSeenAt = Date.now();
            setStatus('Initializing app...');
          } else if (Date.now() - surfaceSeenAt > 10000) {
            showRetry('UI initialization is delayed. Press Reload.');
          }
        }
      };
      var mutationObserver = new MutationObserver(function () {
        detectFlutterUi();
      });
      mutationObserver.observe(document.documentElement, {
        childList: true,
        subtree: true
      });
      var flutterUiPoll = setInterval(detectFlutterUi, 250);
      window.addEventListener('load', detectFlutterUi, { once: true });
      window.addEventListener('flutter-first-frame', function () {
        markStarted();
      }, { once: true });
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(String(Date.now()));
      script.async = true;
      script.onload = function () {
        setStatus('Loading UI...');
        setTimeout(detectFlutterUi, 0);
        setTimeout(detectFlutterUi, 1000);
      };
      script.onerror = function () {
        clearTimeout(hardTimeoutId);
        clearInterval(flutterUiPoll);
        if (mutationObserver) mutationObserver.disconnect();
        showRetry('Failed to load app files.');
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
