<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payparq Scanner</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=pp_static_v3">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=pp_static_v3">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=pp_static_v3">
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png?v=pp_static_v3">
  <link rel="manifest" href="manifest.json">
  <style>
    body { background-color: #000; margin: 0; font-family: sans-serif; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #000; z-index: 9999; }
    .loader { color: #fff; font-size: 28px; font-weight: 800; letter-spacing: -0.4px; text-shadow: 0 0 12px rgba(255,255,255,0.24); }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader">payparq.ai</div>
  </div>
  <script>
    (function () {
      var loadingEl = document.getElementById('loading');
      var isHidden = false;
      var bootOnce = false;
      var hideLoading = function () {
        if (isHidden) return;
        isHidden = true;
        if (!loadingEl) return;
        loadingEl.style.pointerEvents = 'none';
        loadingEl.style.display = 'none';
      };
      var showRetry = function (text) {
        if (!loadingEl) return;
        if (document.getElementById('boot-retry')) return;
        var statusEl = document.createElement('div');
        statusEl.textContent = text;
        statusEl.style.marginTop = '14px';
        statusEl.style.color = '#9ca3af';
        statusEl.style.fontSize = '13px';
        statusEl.style.textAlign = 'center';
        loadingEl.appendChild(statusEl);
        var btn = document.createElement('button');
        btn.id = 'boot-retry';
        btn.textContent = 'Reload';
        btn.style.marginTop = '12px';
        btn.style.padding = '10px 14px';
        btn.style.border = '0';
        btn.style.borderRadius = '8px';
        btn.style.fontWeight = '700';
        btn.style.cursor = 'pointer';
        btn.onclick = function () {
          window.location.reload();
        };
        loadingEl.appendChild(btn);
      };
      var boot = function () {
        if (bootOnce) return;
        bootOnce = true;
        var hardTimeoutId = setTimeout(function () {
          if (!isHidden) {
            showRetry('Startup is taking longer than expected.');
          }
        }, 25000);
        window.addEventListener('flutter-first-frame', function () {
          clearTimeout(hardTimeoutId);
          hideLoading();
        }, { once: true });
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        script.onerror = function () {
          clearTimeout(hardTimeoutId);
          showRetry('Failed to load app files.');
        };
        document.body.appendChild(script);
        window.addEventListener('error', function (event) {
          clearTimeout(hardTimeoutId);
          var message = (event && (event.message || (event.error && event.error.message))) || 'App failed during startup.';
          showRetry(message + ' Reload.');
        }, { once: true });
        window.addEventListener('unhandledrejection', function (event) {
          clearTimeout(hardTimeoutId);
          var reason = event && event.reason;
          var message = typeof reason === 'string'
            ? reason
            : (reason && reason.message) || 'App failed during startup.';
          showRetry(message + ' Reload.');
        }, { once: true });
      };
      var swResetKey = 'pp_sw_reset_v3';
      var shouldReloadAfterSwReset = false;
      var swResetPromise = Promise.resolve();
      var clearStoredLocationSelection = function () {
        try {
          var keysToRemove = [];
          for (var i = 0; i < window.localStorage.length; i++) {
            var key = window.localStorage.key(i);
            if (!key) continue;
            if (
              key.indexOf('selected_location_display_id') !== -1 ||
              key.indexOf('selected_location_uuid') !== -1 ||
              key.indexOf('flutter.selected_location_display_id') !== -1 ||
              key.indexOf('flutter.selected_location_uuid') !== -1
            ) {
              keysToRemove.push(key);
            }
          }
          keysToRemove.forEach(function (key) {
            window.localStorage.removeItem(key);
          });
        } catch (_) {}
      };
      if ('serviceWorker' in navigator) {
        try {
          shouldReloadAfterSwReset = !sessionStorage.getItem(swResetKey);
          if (shouldReloadAfterSwReset) {
            sessionStorage.setItem(swResetKey, '1');
          }
          swResetPromise = navigator.serviceWorker.getRegistrations()
            .then(function (registrations) {
              return Promise.all(registrations.map(function (reg) { return reg.unregister(); }));
            })
            .then(function () {
              if (!('caches' in window) || !window.caches.keys) return;
              return window.caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return window.caches.delete(key); }));
              });
            })
            .then(function () {
              clearStoredLocationSelection();
            })
            .catch(function () {});
        } catch (_) {}
      }
      swResetPromise.finally(function () {
        if (shouldReloadAfterSwReset) {
          var url = new URL(window.location.href);
          url.searchParams.set('sw_reset', Date.now().toString());
          window.location.replace(url.toString());
          return;
        }
        boot();
      });
    })();
  </script>
</body>
</html>
