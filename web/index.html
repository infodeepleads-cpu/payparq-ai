<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payparq Scanner</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=pp_v10">
  <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg?v=pp_v10">
  <link rel="manifest" href="manifest.json">
  <style>
    body { background-color: #000; margin: 0; font-family: sans-serif; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #000; z-index: 9999; }
    .loader { color: #fff; font-size: 28px; font-weight: 800; letter-spacing: -0.4px; text-shadow: 0 0 12px rgba(255,255,255,0.24); animation: pulse 1.1s ease-in-out infinite alternate; }
    @keyframes pulse { 0% { opacity: 0.62; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader">payparq.ai</div>
    <div id="boot-status" style="margin-top:14px;color:#9ca3af;font-size:13px;text-align:center;"></div>
  </div>
  <script>
    (function () {
      var statusEl = document.getElementById('boot-status');
      var loadingEl = document.getElementById('loading');
      var isHidden = false;
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            registration.unregister();
          });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            caches.delete(key);
          });
        });
      }
      var setStatus = function (text) {
        if (statusEl) statusEl.textContent = text || '';
      };
      var hideLoading = function () {
        if (isHidden) return;
        isHidden = true;
        if (!loadingEl) return;
        loadingEl.style.opacity = '0';
        loadingEl.style.pointerEvents = 'none';
        setTimeout(function () {
          if (loadingEl) loadingEl.style.display = 'none';
        }, 180);
      };
      var showRetry = function (text) {
        setStatus(text);
        if (!loadingEl) return;
        if (document.getElementById('boot-retry')) return;
        var btn = document.createElement('button');
        btn.id = 'boot-retry';
        btn.textContent = 'Reload';
        btn.style.marginTop = '12px';
        btn.style.padding = '10px 14px';
        btn.style.border = '0';
        btn.style.borderRadius = '8px';
        btn.style.fontWeight = '700';
        btn.style.cursor = 'pointer';
        btn.onclick = function () {
          window.location.reload();
        };
        loadingEl.appendChild(btn);
      };
      setStatus('Starting app...');
      var detectFlutterSurface = function () {
        return Boolean(
          document.querySelector('flt-glass-pane') ||
          document.querySelector('flutter-view') ||
          document.querySelector('flt-scene-host') ||
          document.querySelector('flt-semantics-host')
        );
      };
      var hardTimeoutId = setTimeout(function () {
        if (!isHidden) {
          showRetry('Startup is taking longer than expected.');
        }
      }, 25000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(hardTimeoutId);
        hideLoading();
      }, { once: true });
      var surfacePoll = setInterval(function () {
        if (isHidden) {
          clearInterval(surfacePoll);
          return;
        }
        if (detectFlutterSurface()) {
          setStatus('Initializing app...');
          clearInterval(surfacePoll);
        }
      }, 250);
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(String(Date.now()));
      script.async = true;
      script.onload = function () {
        setStatus('Loading UI...');
      };
      script.onerror = function () {
        clearTimeout(hardTimeoutId);
        clearInterval(surfacePoll);
        showRetry('Failed to load app files.');
      };
      document.body.appendChild(script);
      window.addEventListener('error', function (event) {
        clearTimeout(hardTimeoutId);
        clearInterval(surfacePoll);
        var message = (event && (event.message || (event.error && event.error.message))) || 'App failed during startup.';
        showRetry(message + ' Reload.');
      }, { once: true });
      window.addEventListener('unhandledrejection', function (event) {
        clearTimeout(hardTimeoutId);
        clearInterval(surfacePoll);
        var reason = event && event.reason;
        var message = typeof reason === 'string'
          ? reason
          : (reason && reason.message) || 'App failed during startup.';
        showRetry(message + ' Reload.');
      }, { once: true });
    })();
  </script>
</body>
</html>
